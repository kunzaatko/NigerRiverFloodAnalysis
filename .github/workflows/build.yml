---
name: 'Build LaTeX Document with Biber'
on:
  push:
    branches:
      - trunk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/cache@v4
        name: Tectonic Cache
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex') }}
          restore-keys: |
           ${{ runner.os }}-tectonic-
      - uses: wtfjoke/setup-tectonic@v3
        name: Setup Tectonic
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          biber-version: '2.17'

      - name: Build document
        working-directory: report
        run: |
          tectonic -X build

      - name: Upload pdf
        uses: actions/upload-artifact@v4
        with:
          name: Niger_river_report
          path: report/build/01MEU_Niger_River/01MEU_Niger_River.pdf
